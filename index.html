<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GraphQL Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<section id="login-view" hidden>
  <form id="login-form" class="login-card">
    <h1>Log in</h1>
    <p class="login-sub">Username or email, either works.</p>

    <label for="identifier">Username or email</label>
    <input id="identifier" name="identifier" type="text"
           autocomplete="username" autocapitalize="none" spellcheck="false">

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password">

    <p id="login-error" class="error" role="alert"></p>

    <button type="submit" class="btn-block">Log in</button>
  </form>
</section>

<section id="profile-view" hidden>
  <header class="topbar">
    <span class="brand">GraphQL Profile</span>
    <div class="topbar-right">
      <span id="session-login" class="session-login"></span>
      <button type="button" id="logout" class="btn-secondary">Log out</button>
    </div>
  </header>

  <main class="page">
    <p id="loading">Loading…</p>
    <p id="profile-error" class="error" role="alert"></p>

    <div class="hero">
      <h1 id="user-name"></h1>
      <div class="hero-meta">
        <span id="user-login"></span>
        <span class="sep">/</span>
        <span id="user-email"></span>
        <span class="sep">/</span>
        <span>ID <span id="user-id"></span></span>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat">
        <p class="stat-label">Total XP</p>
        <p class="stat-value" id="total-xp"></p>
        <p class="stat-sub" id="xp-count"></p>
      </div>
      <div class="stat">
        <p class="stat-label">Audit ratio</p>
        <p class="stat-value" id="audit-ratio"></p>
        <p class="stat-sub"><span id="audit-up"></span> done, <span id="audit-down"></span> received</p>
      </div>
      <div class="stat">
        <p class="stat-label">Projects passed</p>
        <p class="stat-value" id="projects-passed"></p>
        <p class="stat-sub">graded projects</p>
      </div>
    </div>

    <hr class="hr">

    <section class="chart-block">
      <div class="chart-head">
        <div>
          <h2>XP over time</h2>
          <p class="chart-sub">Cumulative, module XP only</p>
        </div>
      </div>
      <div class="chart" id="chart-xp-time"></div>
    </section>

    <hr class="hr">

    <div class="chart-columns">
      <section class="chart-block">
        <div class="chart-head">
          <div>
            <h2>XP by project</h2>
            <p class="chart-sub">Ten highest-earning projects</p>
          </div>
        </div>
        <div class="chart" id="chart-xp-project"></div>
      </section>

      <section class="chart-block">
        <div class="chart-head">
          <div>
            <h2>Passed and failed</h2>
          </div>
        </div>
        <div class="chart" id="chart-pass-fail"></div>
      </section>
    </div>
  </main>
</section>

<script type="module" src="js/main.js"></script>
</body>
</html>
